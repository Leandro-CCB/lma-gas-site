<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="financeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="60%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="600" height="400" fill="url(#financeBg)" />
  
  <!-- FINANCIAL DASHBOARD BOARD -->
  <rect x="40" y="30" width="520" height="340" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2.5" filter="drop-shadow(0 6px 16px rgba(16,185,129,0.15))" />

  <!-- TOP HEADER OF DASHBOARD -->
  <path d="M 40,46 Q 40,30 56,30 L 544,30 Q 560,30 560,46 L 560,80 L 40,80 Z" fill="#065f46" />
  <text x="65" y="60" font-family="sans-serif" font-size="16" font-weight="black" fill="#ffffff">LMA GÁS • Controle Financeiro &amp; Caixa</text>
  <rect x="440" y="45" width="100" height="24" rx="12" fill="#10b981" />
  <text x="455" y="61" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">✓ 100% Em Dia</text>

  <!-- 3 STATS CARDS -->
  <!-- 1. Entradas -->
  <g transform="translate(65, 95)">
    <rect x="0" y="0" width="145" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Entradas do Dia</text>
    <text x="14" y="48" font-family="sans-serif" font-size="18" font-weight="black" fill="#15803d">R$ 2.415,00</text>
    <text x="14" y="62" font-family="sans-serif" font-size="9.5" fill="#16a34a">+21 botijões vendidos</text>
  </g>

  <!-- 2. Contas a Pagar -->
  <g transform="translate(225, 95)">
    <rect x="0" y="0" width="145" height="70" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
    <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Contas a Pagar</text>
    <text x="14" y="48" font-family="sans-serif" font-size="18" font-weight="black" fill="#b91c1c">0 Vencidas</text>
    <text x="14" y="62" font-family="sans-serif" font-size="9.5" fill="#dc2626">Tudo pago no prazo</text>
  </g>

  <!-- 3. Saldo Líquido -->
  <g transform="translate(385, 95)">
    <rect x="0" y="0" width="150" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">Saldo em Caixa</text>
    <text x="14" y="48" font-family="sans-serif" font-size="18" font-weight="black" fill="#1d4ed8">R$ 1.895,00</text>
    <text x="14" y="62" font-family="sans-serif" font-size="9.5" fill="#2563eb">Fechamento seguro</text>
  </g>

  <!-- UPWARD FINANCIAL GROWTH CHART -->
  <g transform="translate(65, 185)">
    <rect x="0" y="0" width="470" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Grid lines -->
    <line x1="20" y1="40" x2="450" y2="40" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="80" x2="450" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="120" x2="450" y2="120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Chart Fill Area -->
    <path d="M 30,125 L 85,110 L 145,95 L 205,100 L 270,70 L 340,55 L 420,30 L 420,140 L 30,140 Z" fill="url(#chartGrad)" />
    <!-- Bold Green Upward Line -->
    <path d="M 30,125 L 85,110 L 145,95 L 205,100 L 270,70 L 340,55 L 420,30" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Points on chart -->
    <circle cx="85" cy="110" r="4" fill="#ffffff" stroke="#10b981" stroke-width="3" />
    <circle cx="145" cy="95" r="4" fill="#ffffff" stroke="#10b981" stroke-width="3" />
    <circle cx="270" cy="70" r="4" fill="#ffffff" stroke="#10b981" stroke-width="3" />
    <circle cx="420" cy="30" r="6" fill="#10b981" stroke="#ffffff" stroke-width="3" />

    <!-- Indicator Tag -->
    <rect x="360" y="8" width="85" height="20" rx="5" fill="#10b981" />
    <text x="368" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">▲ +38% Lucro</text>
  </g>

  <!-- SHINING GOLDEN COINS (ANIME SPARKLES) -->
  <g transform="translate(480, 260)">
    <circle cx="30" cy="30" r="18" fill="url(#goldCoin)" stroke="#a16207" stroke-width="2" />
    <text x="24" y="36" font-family="sans-serif" font-size="16" font-weight="black" fill="#ffffff">$</text>
    <circle cx="50" cy="45" r="14" fill="url(#goldCoin)" stroke="#a16207" stroke-width="1.5" />
    <text x="45" y="50" font-family="sans-serif" font-size="12" font-weight="black" fill="#ffffff">$</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="p13BlueShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#93c5fd" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>

  <!-- SKY & SUNNY STREET -->
  <rect width="600" height="400" fill="url(#heroSky)" />
  
  <!-- SPEED LINES / ANIME ENERGY -->
  <line x1="0" y1="120" x2="220" y2="135" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-dasharray="30 10" />
  <line x1="0" y1="160" x2="200" y2="175" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-dasharray="40 15" />
  <line x1="0" y1="210" x2="230" y2="220" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-dasharray="50 15" />

  <!-- SUNNY ASPHALT STREET -->
  <polygon points="0,290 600,290 600,400 0,400" fill="#475569" />
  <polygon points="180,290 220,290 190,400 150,400" fill="#fef08a" opacity="0.7" />
  <polygon points="380,290 420,290 390,400 350,400" fill="#fef08a" opacity="0.7" />

  <!-- SHADOW ON GROUND -->
  <ellipse cx="300" cy="370" rx="80" ry="18" fill="#0f172a" opacity="0.35" />

  <!-- ANIME DELIVERY MAN (CONFIDENT, CARRYING P13 ON SHOULDER) -->
  <g transform="translate(190, 40)">
    <!-- Legs / Stride -->
    <polygon points="90,240 120,240 135,325 105,325" fill="#1e293b" />
    <polygon points="120,240 150,240 170,320 140,320" fill="#0f172a" />
    <!-- Safety Boots -->
    <path d="M 100,325 L 140,325 L 142,342 L 95,342 Z" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <path d="M 140,320 L 180,320 L 182,338 L 135,338 Z" fill="#b45309" stroke="#78350f" stroke-width="2" />

    <!-- Torso (Muscular Delivery Uniform) -->
    <polygon points="80,120 160,120 150,245 90,245" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
    <!-- Emerald Green Collar -->
    <polygon points="105,120 120,138 135,120 125,115 115,115" fill="#10b981" />

    <!-- Left Arm: Balanced forward with smartphone for Waze/Maps -->
    <path d="M 90,130 Q 55,160 50,190" stroke="url(#skin)" stroke-width="22" stroke-linecap="round" fill="none" />
    <!-- Hand holding phone -->
    <rect x="35" y="180" width="20" height="34" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="45" cy="208" r="2" fill="#38bdf8" />

    <!-- Head / Face -->
    <path d="M 95,65 Q 120,50 145,65 Q 150,105 120,118 Q 90,105 95,65 Z" fill="url(#skin)" />
    <!-- Anime Blush -->
    <ellipse cx="102" cy="94" rx="6" ry="3" fill="#f87171" opacity="0.6" />
    <ellipse cx="138" cy="94" rx="6" ry="3" fill="#f87171" opacity="0.6" />
    <!-- Big Anime Eyes with Sparkle -->
    <ellipse cx="106" cy="82" rx="7" ry="10" fill="#0f172a" />
    <ellipse cx="134" cy="82" rx="7" ry="10" fill="#0f172a" />
    <circle cx="108" cy="79" r="2.5" fill="#ffffff" />
    <circle cx="136" cy="79" r="2.5" fill="#ffffff" />
    <circle cx="105" cy="87" r="1.5" fill="#38bdf8" />
    <circle cx="133" cy="87" r="1.5" fill="#38bdf8" />
    <!-- Confident anime smile -->
    <path d="M 112,100 Q 120,112 128,100" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cap (Boné do Entregador) -->
    <path d="M 92,62 Q 120,25 148,62 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
    <path d="M 85,60 Q 120,50 160,58 Q 150,68 95,68 Z" fill="#10b981" stroke="#059669" stroke-width="2" />

    <!-- ============================================= -->
    <!-- METALLIC P13 BOTIJÃO RESTING ON HIS SHOULDER -->
    <!-- ============================================= -->
    <g transform="translate(130, 20) rotate(-15)">
      <!-- Main Cylinder Body -->
      <rect x="0" y="25" width="75" height="110" rx="28" fill="url(#p13BlueShine)" stroke="#1e3a8a" stroke-width="2" />
      <line x1="0" y1="80" x2="75" y2="80" stroke="#93c5fd" stroke-width="2" opacity="0.6" />
      <!-- Specular Highlight Line -->
      <path d="M 18,28 Q 24,80 20,130" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.6" />
      <!-- Top Ring & Valve -->
      <ellipse cx="37" cy="25" rx="26" ry="10" fill="#1e3a8a" />
      <path d="M 18,22 L 18,5 Q 37,-4 56,5 L 56,22 Z" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
      <!-- Safety Seal (Lacre Verde) -->
      <circle cx="37" cy="10" r="6" fill="#10b981" stroke="#059669" stroke-width="1.5" />
    </g>

    <!-- Right Arm: Holding the cylinder handle on the shoulder firmly -->
    <path d="M 150,130 Q 185,100 180,60" stroke="url(#skin)" stroke-width="22" stroke-linecap="round" fill="none" />
    <!-- Blue Work Glove -->
    <circle cx="178" cy="55" r="12" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
  </g>

  <!-- FLOATING ANIME BADGE -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="180" height="70" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.12))" />
    <text x="18" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Ágil &amp; Pontual</text>
    <text x="18" y="46" font-family="sans-serif" font-size="11" font-weight="600" fill="#0284c7">Botijão entregue no ato</text>
    <text x="18" y="60" font-family="sans-serif" font-size="9.5" font-weight="normal" fill="#64748b">Rota rápida via GPS</text>
  </g>
</svg>
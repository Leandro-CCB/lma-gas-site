<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="depotBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="p13Blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="p13Green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="p13Red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="waterBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cageSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND: ANIME WAREHOUSE / DEPOT -->
  <rect width="600" height="400" fill="url(#depotBg)" />
  
  <!-- INDUSTRIAL DEPOT ROOF BEAMS -->
  <polygon points="0,0 600,0 600,60 0,90" fill="#334155" />
  <line x1="0" y1="40" x2="600" y2="40" stroke="#f1f5f9" stroke-width="3" opacity="0.4" />
  <line x1="120" y1="0" x2="120" y2="120" stroke="#475569" stroke-width="6" />
  <line x1="300" y1="0" x2="300" y2="120" stroke="#475569" stroke-width="6" />
  <line x1="480" y1="0" x2="480" y2="120" stroke="#475569" stroke-width="6" />
  
  <!-- DEPOT FLOOR WITH SAFETY LINES -->
  <polygon points="0,220 600,220 600,400 0,400" fill="#e2e8f0" />
  <rect x="0" y="370" width="600" height="30" fill="#fef08a" />
  <line x1="0" y1="370" x2="600" y2="370" stroke="#ca8a04" stroke-width="4" stroke-dasharray="25 15" />

  <!-- STORAGE CAGES (GAIOLAS INDUSTRIAIS) -->
  <rect x="40" y="110" width="240" height="230" rx="8" fill="#f1f5f9" stroke="url(#cageSteel)" stroke-width="5" />
  <line x1="40" y1="185" x2="280" y2="185" stroke="#64748b" stroke-width="4" />
  <line x1="40" y1="260" x2="280" y2="260" stroke="#64748b" stroke-width="4" />
  <line x1="100" y1="110" x2="100" y2="340" stroke="#94a3b8" stroke-width="2" />
  <line x1="160" y1="110" x2="160" y2="340" stroke="#94a3b8" stroke-width="2" />
  <line x1="220" y1="110" x2="220" y2="340" stroke="#94a3b8" stroke-width="2" />

  <!-- STACKED BLUE P13 CYLINDERS (SHELF 1) -->
  <g transform="translate(50, 120)">
    <rect x="5" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="27" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="60" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="82" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="115" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="137" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="170" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="192" cy="15" rx="12" ry="4" fill="#cbd5e1" />
  </g>

  <!-- STACKED GREEN & RED P13 CYLINDERS (SHELF 2) -->
  <g transform="translate(50, 195)">
    <rect x="5" y="15" width="45" height="45" rx="14" fill="url(#p13Green)" />
    <ellipse cx="27" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="60" y="15" width="45" height="45" rx="14" fill="url(#p13Green)" />
    <ellipse cx="82" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="115" y="15" width="45" height="45" rx="14" fill="url(#p13Red)" />
    <ellipse cx="137" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="170" y="15" width="45" height="45" rx="14" fill="url(#p13Red)" />
    <ellipse cx="192" cy="15" rx="12" ry="4" fill="#cbd5e1" />
  </g>

  <!-- STACKED BLUE P13 CYLINDERS (SHELF 3) -->
  <g transform="translate(50, 270)">
    <rect x="5" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="27" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="60" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="82" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="115" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="137" cy="15" rx="12" ry="4" fill="#cbd5e1" />
    <rect x="170" y="15" width="45" height="45" rx="14" fill="url(#p13Blue)" />
    <ellipse cx="192" cy="15" rx="12" ry="4" fill="#cbd5e1" />
  </g>

  <!-- 20L MINERAL WATER BOTTLES PALLET (RIGHT) -->
  <g transform="translate(320, 210)">
    <rect x="0" y="100" width="140" height="20" rx="3" fill="#b45309" />
    <!-- Row 1 water -->
    <rect x="10" y="30" width="34" height="65" rx="10" fill="url(#waterBlue)" opacity="0.9" />
    <rect x="52" y="30" width="34" height="65" rx="10" fill="url(#waterBlue)" opacity="0.9" />
    <rect x="94" y="30" width="34" height="65" rx="10" fill="url(#waterBlue)" opacity="0.9" />
    <ellipse cx="27" cy="30" rx="8" ry="3" fill="#ffffff" />
    <ellipse cx="69" cy="30" rx="8" ry="3" fill="#ffffff" />
    <ellipse cx="111" cy="30" rx="8" ry="3" fill="#ffffff" />
  </g>

  <!-- INDUSTRIAL P45 TALL CYLINDERS -->
  <g transform="translate(480, 110)">
    <rect x="10" y="30" width="32" height="180" rx="12" fill="url(#p13Blue)" />
    <ellipse cx="26" cy="30" rx="12" ry="6" fill="#cbd5e1" />
    <rect x="55" y="30" width="32" height="180" rx="12" fill="url(#p13Blue)" />
    <ellipse cx="71" cy="30" rx="12" ry="6" fill="#cbd5e1" />
  </g>

  <!-- ANIME INVENTORY CHECKLIST / BADGE -->
  <g transform="translate(330, 45)">
    <rect x="0" y="0" width="240" height="85" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="3" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))" />
    <circle cx="36" cy="42" r="20" fill="#10b981" />
    <path d="M 28,42 L 34,48 L 46,36" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="68" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Estoque 100% Monitorado</text>
    <text x="68" y="55" font-family="sans-serif" font-size="12" font-weight="600" fill="#10b981">142 Cheios • 88 Vazios</text>
    <text x="68" y="70" font-family="sans-serif" font-size="10" font-weight="normal" fill="#64748b">Alerta automático de reposição</text>
  </g>
</svg>
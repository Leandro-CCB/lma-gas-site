<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="60%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="skinGirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="hairGirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- OFFICE WALL BACKGROUND -->
  <rect width="600" height="400" fill="url(#officeBg)" />
  
  <!-- OFFICE WINDOW WITH SUNSHINE -->
  <rect x="40" y="40" width="140" height="130" rx="8" fill="#bae6fd" stroke="#ffffff" stroke-width="6" />
  <line x1="110" y1="40" x2="110" y2="170" stroke="#ffffff" stroke-width="4" />
  <line x1="40" y1="105" x2="180" y2="105" stroke="#ffffff" stroke-width="4" />
  <circle cx="80" cy="75" r="20" fill="#fef08a" />

  <!-- DESK (MESA DA REVENDA) -->
  <rect x="0" y="270" width="600" height="130" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <rect x="0" y="270" width="600" height="16" fill="#f1f5f9" />

  <!-- COMPUTER MONITOR SHOWING LMA GÁS -->
  <g transform="translate(60, 160)">
    <!-- Stand -->
    <rect x="65" y="100" width="20" height="25" fill="#94a3b8" />
    <rect x="45" y="122" width="60" height="8" rx="3" fill="#64748b" />
    <!-- Screen -->
    <rect x="0" y="0" width="150" height="100" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
    <rect x="6" y="6" width="138" height="88" fill="#ffffff" />
    <!-- Simulated LMA Gás System Screen -->
    <rect x="10" y="10" width="130" height="14" fill="#0284c7" />
    <text x="14" y="21" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff">LMA GÁS • Clientes +60d</text>
    <rect x="10" y="30" width="130" height="18" fill="#fef2f2" stroke="#fecaca" />
    <text x="14" y="42" font-family="sans-serif" font-size="7" font-weight="bold" fill="#dc2626">D. Maria (64d sem gás)</text>
    <rect x="10" y="52" width="130" height="16" fill="#f8fafc" />
    <text x="14" y="63" font-family="sans-serif" font-size="7" fill="#64748b">Sr. Antônio (72d sem gás)</text>
    <rect x="10" y="72" width="50" height="12" rx="3" fill="#10b981" />
    <text x="16" y="81" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">LIGAR AGORA</text>
  </g>

  <!-- CUTE COFFEE MUG ON DESK -->
  <rect x="230" y="250" width="24" height="28" rx="4" fill="#ec4899" />
  <path d="M 254,256 Q 264,264 254,272" stroke="#ec4899" stroke-width="3" fill="none" />
  <!-- Steam from coffee -->
  <path d="M 238,245 Q 242,235 238,225" stroke="#f472b6" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- ANIME RECEPTIONIST CHARACTER (GIRL WITH HEADSET) -->
  <g transform="translate(320, 90)">
    <!-- Body / Professional Emerald Blouse -->
    <path d="M 50,165 L 140,165 L 150,280 L 40,280 Z" fill="#059669" stroke="#047857" stroke-width="2" />
    <polygon points="80,165 95,190 110,165" fill="#fef08a" />
    
    <!-- Left Hand Holding Microphone / Telephone Cord -->
    <path d="M 52,175 Q 30,210 50,240" stroke="url(#skinGirl)" stroke-width="16" stroke-linecap="round" fill="none" />
    <circle cx="52" cy="240" r="8" fill="url(#skinGirl)" />

    <!-- Head / Face -->
    <path d="M 60,70 Q 95,50 130,70 Q 135,115 95,130 Q 55,115 60,70 Z" fill="url(#skinGirl)" />
    <!-- Anime Rosy Cheeks -->
    <ellipse cx="72" cy="104" rx="7" ry="4" fill="#fb7185" opacity="0.6" />
    <ellipse cx="118" cy="104" rx="7" ry="4" fill="#fb7185" opacity="0.6" />
    <!-- Expressive Anime Eyes (Sparkling, friendly) -->
    <ellipse cx="78" cy="90" rx="8" ry="11" fill="#0f172a" />
    <ellipse cx="112" cy="90" rx="8" ry="11" fill="#0f172a" />
    <circle cx="81" cy="86" r="3" fill="#ffffff" />
    <circle cx="115" cy="86" r="3" fill="#ffffff" />
    <circle cx="77" cy="96" r="1.5" fill="#10b981" />
    <circle cx="111" cy="96" r="1.5" fill="#10b981" />
    <!-- Cheerful Open Smile -->
    <path d="M 86,110 Q 95,122 104,110 Z" fill="#e11d48" stroke="#be123c" stroke-width="1.5" />

    <!-- Stylish Anime Hair (Brunette with side ponytail) -->
    <path d="M 55,70 Q 95,30 135,70 Q 145,120 140,150 Q 125,120 135,90 Q 95,45 55,70 Z" fill="url(#hairGirl)" />
    <!-- Bangs -->
    <path d="M 60,65 Q 80,85 88,68 Q 102,88 115,65 Q 125,85 132,68" fill="url(#hairGirl)" />
    <!-- Cute hair clip -->
    <circle cx="130" cy="75" r="6" fill="#f43f5e" />

    <!-- PROFESSIONAL OPERATOR HEADSET -->
    <path d="M 64,85 Q 95,35 126,85" stroke="#334155" stroke-width="5" fill="none" />
    <!-- Ear pad right -->
    <ellipse cx="128" cy="90" rx="6" ry="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <!-- Microphone boom curving to mouth -->
    <path d="M 128,95 Q 125,118 106,118" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="106" cy="118" r="4" fill="#10b981" />
  </g>

  <!-- ANIME SPEECH BUBBLE: CALLING CUSTOMER -->
  <g transform="translate(370, 20)">
    <path d="M 10,15 Q 10,0 30,0 L 190,0 Q 210,0 210,15 L 210,55 Q 210,70 190,70 L 60,70 L 40,85 L 45,70 L 30,70 Q 10,70 10,55 Z" fill="#ffffff" stroke="#10b981" stroke-width="2.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.1))" />
    <text x="25" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#059669">📞 "Olá Dona Maria!"</text>
    <text x="25" y="46" font-family="sans-serif" font-size="10" font-weight="600" fill="#0f172a">"Seu gás está quase no fim?</text>
    <text x="25" y="60" font-family="sans-serif" font-size="9.5" font-weight="normal" fill="#64748b">Posso mandar o entregador?"</text>
  </g>
</svg>